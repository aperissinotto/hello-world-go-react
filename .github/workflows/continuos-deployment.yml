name: Go + React CI/CD Multi-Arch

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    # Login no Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    # Suporte a ARM64 (Raspberry Pi)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Habilita build multi-arquitetura
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # =========================
    # BUILD BACKEND GO
    # =========================
    - name: Build & Push Go Backend (multi-arch)
      run: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ${{ secrets.DOCKER_USERNAME }}/go-backend:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/go-backend:k3s \
          -t ${{ secrets.DOCKER_USERNAME }}/go-backend:${{ github.run_id }} \
          --push \
          ./backend

    # =========================
    # BUILD FRONTEND REACT
    # =========================
    - name: Build & Push React Frontend (multi-arch)
      run: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ${{ secrets.DOCKER_USERNAME }}/react-frontend:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/react-frontend:k3s \
          -t ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.run_id }} \
          --push \
          ./frontend
